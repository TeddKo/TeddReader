// Compose 안정성 선언.
//
// core:common 은 Compose 컴파일러 플러그인을 적용하지 않는 순수 도메인 모듈이라
// 클래스에 안정성 메타데이터가 생성되지 않는다. 그 결과 UI 모듈에서는 이 모델들이
// 전부 unstable 로 취급되고, strong skipping 이 equals() 대신 인스턴스 동등(===)
// 으로 비교하기 때문에 값이 같아도 매 emission 마다 recomposition 이 발생한다.
//
// 안정 선언의 전제: 아래 패키지의 타입은 전부 val 프로퍼티만 가진 data/value/enum
// 클래스이며 ByteArray 나 가변 컬렉션 필드를 보유하지 않는다. 이 전제를 깨는 모델을
// 추가하면 내용이 바뀌어도 recomposition 이 생략되는 갱신 누락으로 이어진다.
//
// 주의: 이 파일의 내용은 Kotlin 컴파일 태스크의 입력으로 등록되지 않는다. 경로만
// 입력이라 내용을 고쳐도 태스크가 UP-TO-DATE 로 남는다. 수정 후에는 --rerun-tasks
// 또는 clean 으로 재컴파일을 강제해야 반영된다.
com.tedd.teddreader.core.common.model.*
